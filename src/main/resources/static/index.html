<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Sign in · Sellfusion Family</title>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/styles.css"/>
    <link rel="stylesheet" href="/auth.css"/>
    <script src="/js/passkey.js" defer></script>
</head>
<body class="auth-page">
<header class="auth-toolbar">
    <label class="auth-theme-control" for="authTheme">
        <span>Appearance</span>
        <select id="authTheme" data-theme-select>
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
    </label>
</header>
<main class="auth-main">
    <section class="auth-card" aria-labelledby="authTitle">
        <a class="auth-brand" href="/" aria-label="Sellfusion Family sign in">
            <span class="auth-brand-mark" aria-hidden="true"><img src="/img/family-logo.png" width="512" height="451" alt=""/></span>
            <span>Koppel, Judios, Zoopie &amp; Sellfusion Family</span>
        </a>
        <h1 id="authTitle">Welcome back</h1>
        <p class="auth-intro">Sign in to your team's workspace with your passkey.</p>
        <form id="loginForm" class="auth-form" data-auth-flow="login" novalidate>
            <div class="auth-field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="255" pattern="[A-Za-z0-9_]+" required autofocus aria-describedby="usernameHelp log"/>
                <p id="usernameHelp" class="auth-help">Use the username you registered with.</p>
            </div>
            <button id="loginButton" class="auth-submit" type="submit">Sign in with passkey</button>
        </form>
        <p class="auth-passkey-note">Confirm with your fingerprint, face, or device PIN.</p>
        <div id="log" class="auth-status" role="status" aria-live="polite" aria-atomic="true" hidden></div>
        <noscript><p class="auth-status" data-state="error">JavaScript is needed to use a passkey. Enable it in your browser, then reload this page.</p></noscript>
        <p class="auth-switch">New to the team? <a href="/register.html">Create an account</a></p>
    </section>
</main>
<footer class="auth-footer">Your workspace. One family.</footer>
</body>
</html>
